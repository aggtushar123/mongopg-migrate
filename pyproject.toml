[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mongopg-migrate"
version = "0.1.0"
description = "Map MongoDB collections onto an existing, independently designed PostgreSQL schema and run a validated, repeatable migration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mongopg-migrate contributors" }]
dependencies = [
    "pymongo>=4.6",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mongomock>=4.1",
    "ruff>=0.6",
]
# PRD §8: LLM integration is pluggable and off by default — not a hard
# dependency. Only needed for `propose --llm` with the default
# AnthropicLLMClient (mapping/llm_client.py).
llm = [
    "anthropic>=1.0",
]

[project.scripts]
mongopg-migrate = "mongopg_migrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mongopg_migrate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
