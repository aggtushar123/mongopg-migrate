name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest)
        run: pytest -q

  # Real Mongo + real Postgres, through the actual CLI — the automated
  # answer to a real review comment: "SIGKILL-resume, Docker-network runs,
  # ... are claimed in the README. Good claims — consider capturing them
  # as a compose-based integration test so CI proves them, not prose."
  # Separate from `test` above (which is pure unit tests, no network,
  # matrixed across Python versions): this only needs to run once — the
  # point is proving Mongo/Postgres behavior, not Python-version
  # compatibility, which the unit-test matrix already covers.
  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Integration tests (real Mongo + real Postgres, incl. SIGKILL-resume)
        env:
          MONGO_URI: mongodb://localhost:27017/app
          POSTGRES_URI: postgresql://postgres:postgres@localhost:55432/app
        run: pytest -q tests/integration
